<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- Subtle border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.5" />
  <!-- Letter J -->
  <text x="10" y="46" font-family="'Inter', 'Arial', sans-serif" font-size="36" font-weight="800" fill="url(#grad)">J</text>
  <!-- Letter P -->
  <text x="32" y="46" font-family="'Inter', 'Arial', sans-serif" font-size="36" font-weight="800" fill="url(#grad)">P</text>
</svg>